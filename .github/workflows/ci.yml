name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run tests
        run: ./gradlew clean test --stacktrace
      - name: Build jar
        run: ./gradlew build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptimizeIsEasy-jar
          path: build/libs/OptimizeIsEasy-*.jar

  # The shipped jar is compiled against the oldest supported API (1.21.1). This job
  # compiles the same sources against the newest one, so an upstream removal fails CI
  # here instead of on someone's server.
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Compile against the newest Paper API
        run: ./gradlew compileJava compileTestJava -PpaperApi=26.2.build.132-stable -Pjdk=25 --stacktrace