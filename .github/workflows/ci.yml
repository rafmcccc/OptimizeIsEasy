name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: 1.21.x
      - name: Run tests
        run: ./gradlew clean test --stacktrace
        working-directory: 1.21.x
      - name: Build jar
        run: ./gradlew build
        working-directory: 1.21.x
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptimizeIsEasy-jar
          path: 1.21.x/build/libs/OptimizeIsEasy-*.jar
